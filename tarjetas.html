<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarjetas Promocionales</title>
  <style>
    body { background: #111; color: #fff; font-family: Arial, sans-serif; }
    .slider {
      width: 400px;
      height: 150px;
      margin: 50px auto;
      overflow: hidden;
      border: 2px solid #f0c000;
      border-radius: 10px;
      position: relative;
    }
    .cards {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.8s ease-in-out;
    }
    .card {
      min-width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card h2 {
      color: #f0c000;
      margin: 5px 0;
    }
    .card p {
      margin: 5px 0;
      font-size: 18px;
    }
    .card img {
      width: 60px;
      height: auto;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="cards" id="cards">
      <!-- 1ra tarjeta -->
      <div class="card">
        <!-- Si consigues el logo oficial de L2 Reborn, reemplaza el src -->
        <!-- <img src="URL_DEL_LOGO" alt="L2 Reborn Logo"> -->
        <h2>L2 Reborn x10 Interlude</h2>
        <p>🌐 l2reborn.org</p>
      </div>
      <!-- 2da tarjeta -->
      <div class="card">
        <h2>Días de Streaming</h2>
        <p>📅 Lunes a Viernes</p>
        <p>🕒 13:00 a 21:00 hs</p>
      </div>
    </div>
  </div>

  <script>
    const cards = document.getElementById('cards');
    const total = cards.children.length;
    let index = 0;

    setInterval(() => {
      index = (index + 1) % total;
      cards.style.transform = `translateX(-${index * 100}%)`;
    }, 4000); // cambia cada 4 segundos
  </script>
</body>
</html>
