<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarjetas Horizontales</title>
  <style>
    body { background: #111; color: #fff; font-family: Arial, sans-serif; }
    .slider {
      width: 400px;   /* ancho del recuadro */
      height: 150px;  /* alto del recuadro */
      margin: 50px auto;
      overflow: hidden;
      border: 2px solid #f0c000;
      border-radius: 10px;
      position: relative;
    }
    .cards {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.8s ease-in-out;
    }
    .card {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .card img {
      width: 28px;
      height: 28px;
      margin-right: 10px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="cards" id="cards">
      <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"> Facebook: /TuUsuario
      </div>
      <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"> YouTube: /TuCanal
      </div>
      <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968919.png"> Kick: /TuUsuarioKick
      </div>
      <div class="card">
        ⭐ ¡Gracias por mirar, dar like y seguirme! ⭐
      </div>
    </div>
  </div>

  <script>
    const cards = document.getElementById('cards');
    const total = cards.children.length;
    let index = 0;

    setInterval(() => {
      index = (index + 1) % total;
      cards.style.transform = `translateX(-${index * 100}%)`;
    }, 3000); // cambia cada 3 segundos
  </script>
</body>
</html>
