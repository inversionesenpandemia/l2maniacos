<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Streaming</title>
  <style>
    body { font-family: Arial; background: #111; color: #fff; margin: 0; padding: 20px; }
    .checklist { max-width: 400px; margin: auto; }
    h2 { color: #f0c000; text-align: center; }
    label { display: block; margin: 10px 0; font-size: 18px; }
    input[type=checkbox] { transform: scale(1.3); margin-right: 10px; }
  </style>
</head>
<body>
  <div class="checklist">
    <h2>🎮 Horarios Streaming</h2>
    <label><input type="checkbox" checked> Lunes 20:00</label>
    <label><input type="checkbox" checked> Miércoles 21:00</label>
    <label><input type="checkbox" checked> Viernes 22:00</label>
  </div>
</body>
</html>
