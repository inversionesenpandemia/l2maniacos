<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>L2 Maniacos - Carrusel</title>
  <style>
    body {
      background: #000;
      margin: 0;
      padding: 0;
    }
    .slider {
      width: 100%;
      max-width: 1280px;
      height: 720px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }
    .cards {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 1s ease-in-out;
    }
    .card {
      min-width: 100%;
      height: 100%;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="cards" id="cards">
      <div class="card">
        <img src="l2maniacos.png" alt="Tarjeta 1">
      </div>
      <div class="card">
        <img src="l2maniacos2.png" alt="Tarjeta 2">
      </div>
    </div>
  </div>

  <script>
    const cards = document.getElementById('cards');
    const total = cards.children.length;
    let index = 0;

    setInterval(() => {
      index = (index + 1) % total;
      cards.style.transform = `translateX(-${index * 100}%)`;
    }, 7000); // cambia cada 7 segundos
  </script>
</body>
</html>
