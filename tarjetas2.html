<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarjetas Promocionales</title>
  <style>
    body { background: #111; color: #fff; font-family: Arial, sans-serif; }
    .slider {
      width: 500px;
      height: 250px;
      margin: 50px auto;
      overflow: hidden;
      border: 2px solid #f0c000;
      border-radius: 10px;
      position: relative;
    }
    .cards {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.8s ease-in-out;
    }
    .card {
      min-width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card h2 {
      color: #f0c000;
      margin: 10px 0;
    }
    .card img {
      max-width: 90%;
      height: auto;
      margin: 10px 0;
      border-radius: 8px;
    }
    .socials {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .socials div {
      text-align: center;
    }
    .socials img {
      width: 40px;
      height: 40px;
    }
    .socials p {
      margin: 5px 0 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="slider">
    <div class="cards" id="cards">
      <!-- 1ra tarjeta: Flayer de días de streaming -->
      <div class="card">
        <h2>Días de Streaming</h2>
        <img src="flayer_streaming.png" alt="Flayer Streaming">
      </div>
      <!-- 2da tarjeta: Redes sociales -->
      <div class="card">
        <h2>Mis Redes Sociales</h2>
        <div class="socials">
          <div>
            <img src="facebook_logo.png" alt="Facebook">
            <p>/TuUsuarioFB</p>
          </div>
          <div>
            <img src="youtube_logo.png" alt="YouTube">
            <p>/TuCanalYT</p>
          </div>
          <div>
            <img src="kick_logo.png" alt="Kick">
            <p>/TuUsuarioKick</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cards = document.getElementById('cards');
    const total = cards.children.length;
    let index = 0;

    setInterval(() => {
      index = (index + 1) % total;
      cards.style.transform = `translateX(-${index * 100}%)`;
    }, 4000); // cambia cada 4 segundos
  </script>
</body>
</html>
